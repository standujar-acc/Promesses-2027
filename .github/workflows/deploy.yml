name: Déployer sur Cloudflare Pages
# Actif dès que la variable de dépôt CF_PAGES_PROJECT et les secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID existent.
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  deploy:
    if: ${{ vars.CF_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Le site versionné doit être à jour
        run: python3 pipeline/run.py && git diff --exit-code -- public README.md
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
